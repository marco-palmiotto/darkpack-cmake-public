name: Test darkpack

on:
  pull_request:
    branches:
      - main
  
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro: ['fedora36', 'debian']
    
    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker
      uses: docker/setup-docker-action@v4

    - name: Pull the docker images
      run: docker pull docker.io/marcopalmiotto/darkpack-deploy:${{ matrix.distro }}

    - name: Run tests in ${{ matrix.distro }} container
      run: echo "Running tests in ${{ matrix.distro }} container" && \
           ls ${GITHUB_WORKSPACE}/darkpack-cmake
           
